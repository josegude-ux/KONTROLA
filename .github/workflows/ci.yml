name: Verificar KONTROLA
on:
  push:
    branches: [desarrollo/fase-1-operario]
  pull_request:
    branches: [main, desarrollo/fase-1-operario]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis
        run: |
          node --check src/app.mjs
          node --check src/core.mjs
          node --check src/logic.mjs
          node --check src/verification.mjs
          node --check src/document-review.mjs
          node --check src/report.mjs
          node --check src/admin.mjs
          node --check src/pdf.mjs
      - name: Pruebas de regresión
        run: node --test tests/*.test.mjs
      - name: Migraciones, RLS y concurrencia
        run: npm run test:db
