# Read-only PR review inspection, NEVER an execution/merge gate.
# This workflow is manual and only becomes dispatchable from the default
# branch after an explicitly approved merge. It checks out trusted default
# branch code, never the untrusted PR head.
name: VISURA AUTO-DEV - Manual PR Review Audit

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to inspect (read only)"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Query GitHub PR reviews (GET only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 -m scripts.visura_github_readonly_snapshot "$REPOSITORY" "$PR_NUMBER"
      - name: Inspect branch policies (read only; unknown is not unprotected)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -m scripts.visura_github_policy_probe "$REPOSITORY" "$DEFAULT_BRANCH"
