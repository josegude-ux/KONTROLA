name: VISURA AUTO-DEV - Queue Audit
on:
  push:
    branches:
      - chore/visura-auto-dev-guardrails
    paths:
      - .github/workflows/visura-auto-dev-queue-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: visura-auto-dev-queue-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit approved pilot issue (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["REPO"]
          request=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/31",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept":"application/vnd.github+json",
                       "User-Agent":"visura-queue-audit"})
          with urllib.request.urlopen(request, timeout=15) as response:
              issue=json.load(response)
          if issue.get("number") != 31 or "pull_request" in issue:
              raise SystemExit("Unexpected task type")
          print("Issue #31 read successfully; no instructions executed.")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as report:
              report.write("## VISURA AUTO-DEV — Queue Audit\n")
              report.write(f"- Issue #31: {issue['state']}\n")
              report.write("- Permissions: contents/read, issues/read\n")
              report.write("- OpenRouter API: NOT CALLED\n")
              report.write("- No code generation, commits, merges or deployments\n")
          PY
