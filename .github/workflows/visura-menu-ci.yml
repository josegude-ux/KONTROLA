name: Verificar menu VISURA PREPARA (aislado)
on:
  push:
    branches:
      - feature/visura-prepara-menu-oficial-20261026
  pull_request:
    branches:
      - branding/visura-prepara-20261026
permissions:
  contents: read
jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Instalar dependencias de pruebas
        run: npm ci
      - name: Comprobar sintaxis y regresion completa sin despliegue
        run: |
          npm run check
          node --check tests/visura-menu.test.mjs
