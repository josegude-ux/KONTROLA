name: VISURA PREPARA B01 · Evidencia BC por cada línea en PostgreSQL efímero
on:
  push:
    branches: [feat/visura-prepara-b01-evidencia-por-linea-20261027]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      KONTROLA_TEST_DB: kontrola_test_bc_linea
      KONTROLA_TEST_REINTENTOS: '1'
      KONTROLA_TEST_PROVISIONALES: '1'
      KONTROLA_TEST_HASH_CRUZADO: '1'
      KONTROLA_TEST_TOTAL_BC: '1'
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Suite Node existente y evidencia frontend por línea
        run: |
          npm ci
          npm run check
      - name: Suite SQL documental original en PostgreSQL temporal
        run: npm run test:db
      - name: Propuesta SQL aislada con rechazo de cantidades BC no auditadas
        run: |
          psql -v ON_ERROR_STOP=1 -d "$KONTROLA_TEST_DB" -f supabase/proposals/kontrola_bc_evidencia_por_linea_b01.sql
          psql -v ON_ERROR_STOP=1 -d "$KONTROLA_TEST_DB" -f tests/integration/bc-evidence-every-line.sql | tee /tmp/visura-b01-bc-evidence.log
          grep -q "KONTROLA_B01_EVIDENCIA_CADA_LINEA_OK" /tmp/visura-b01-bc-evidence.log
