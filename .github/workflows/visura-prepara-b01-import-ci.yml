name: VISURA PREPARA Bloque 01 · Errores por PDF (aislado)
on:
  push:
    branches:
      - feat/visura-prepara-b01-importacion-aislada-20261027
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias reproducibles
        run: npm ci
      - name: Pruebas de regresión y validación del lote
        run: |
          npm run check
          node --test tests/import-batch.test.mjs
