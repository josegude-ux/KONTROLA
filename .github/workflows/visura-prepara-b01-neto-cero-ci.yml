name: VISURA PREPARA B01 · Cambios BC compensados con evidencias completas
on:
  push:
    branches:
      - feat/visura-prepara-b01-correcciones-neto-cero-20261027
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      KONTROLA_TEST_DB: kontrola_test_neto_cero
      KONTROLA_TEST_REINTENTOS: '1'
      KONTROLA_TEST_PROVISIONALES: '1'
      KONTROLA_TEST_HASH_CRUZADO: '1'
      KONTROLA_TEST_TOTAL_BC: '1'
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Tests Node anteriores y nuevos de cantidades compensadas
        run: |
          npm ci
          npm run check
      - name: Contratos SQL documentales históricos en base local aislada
        run: npm run test:db
      - name: Conservar endurecimiento de evidencia BC por línea de PR72
        run: |
          psql -v ON_ERROR_STOP=1 -d "$KONTROLA_TEST_DB" -f supabase/proposals/kontrola_bc_evidencia_por_linea_b01.sql
          psql -v ON_ERROR_STOP=1 -d "$KONTROLA_TEST_DB" -f tests/integration/bc-evidence-every-line.sql
      - name: Ensayo neto cero sin permisos productivos ni merge
        run: |
          psql -v ON_ERROR_STOP=1 -d "$KONTROLA_TEST_DB" -f supabase/proposals/kontrola_bc_neto_cero_b01.sql
          psql -v ON_ERROR_STOP=1 -d "$KONTROLA_TEST_DB" -f tests/integration/bc-zero-net.sql | tee /tmp/visura-b01-neto-cero.log
          grep -q KONTROLA_B01_NETO_CERO_EVIDENCIA_OK /tmp/visura-b01-neto-cero.log
      - name: Protección contra modificaciones sin ningún evento de cantidad
        run: |
          psql -v ON_ERROR_STOP=1 -d "$KONTROLA_TEST_DB" -f supabase/proposals/kontrola_qty_sin_evento_b01.sql
          psql -v ON_ERROR_STOP=1 -d "$KONTROLA_TEST_DB" -f tests/integration/quantity-audit-event.sql | tee /tmp/visura-b01-qty-event.log
          grep -q KONTROLA_B01_CANTIDAD_EVENTO_INTEGRIDAD_OK /tmp/visura-b01-qty-event.log
