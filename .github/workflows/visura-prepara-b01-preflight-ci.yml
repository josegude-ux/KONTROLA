name: VISURA PREPARA B01 · Preflight entre ramas (sin merge)
on:
  push:
    branches:
      - audit/visura-prepara-b01-preflight-cruces-20261027
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Descargar referencias públicas para lectura (SIN merge)
        run: |
          git -c http.extraheader="" fetch --no-tags origin \
            "+refs/heads/feat/visura-prepara-integracion-pr49-pr58-20261026:refs/remotes/origin/feat/visura-prepara-integracion-pr49-pr58-20261026" \
            "+refs/heads/feat/visura-prepara-b01-responsive-20261027:refs/remotes/origin/feat/visura-prepara-b01-responsive-20261027" \
            "+refs/heads/feat/visura-prepara-b01-totales-bc-auditados-20261027:refs/remotes/origin/feat/visura-prepara-b01-totales-bc-auditados-20261027"
      - name: Pruebas del analizador y del código actual
        run: |
          npm ci
          node --test tests/preflight-b01.test.mjs
          npm run check
      - name: Leer blobs y obtener lista de archivos coincidentes sin modificar ramas
        run: node scripts/preflight-b01.mjs
      - name: Adjuntar informe read-only
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: visura-prepara-preflight-no-integrado
          path: artifacts/preflight-b01.*
          if-no-files-found: warn
          retention-days: 7
