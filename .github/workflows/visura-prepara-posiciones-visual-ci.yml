name: VISURA PREPARA — posiciones fijas responsive (ensayo)
on:
  push:
    branches:
      - feat/visura-prepara-admin-posiciones-fijas-20261027
  pull_request:
    branches:
      - cursor/verificacion-fisica-cargas-8ba0
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Dependencias bloqueadas
        run: npm ci
      - name: Playwright y Chromium efímeros
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Ensayar escritorio, tablet y móvil con datos simulados
        run: |
          mkdir -p artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 &
          web_pid=$!
          trap 'kill "$web_pid" || true' EXIT
          npx playwright test tests/fixed-position-visual.spec.mjs --reporter=line --workers=1
      - name: Capturas del ensayo visual (no publicación)
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: visura-prepara-posiciones-fijas-responsive
          path: artifacts/fijos-*.png
          if-no-files-found: warn
          retention-days: 7
