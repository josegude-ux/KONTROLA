name: VISURA PREPARA Bloque 01 · Responsive sin despliegue
on:
  push:
    branches:
      - feat/visura-prepara-b01-responsive-20261027
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Verificaciones de sintaxis y lógica sin datos reales
        run: |
          npm ci
          npm run check
      - name: Instalación temporal del motor de pruebas visuales
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Escritorio, tablets, móviles y redimensionado de ventana
        run: |
          mkdir -p artifacts
          npx playwright test tests/responsive-layout.spec.mjs --reporter=line --workers=1
      - name: Conservar capturas para revisión visual
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: visura-prepara-b01-responsive-capturas
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
