name: VISURA - E2E staging ShipStatic web externo SIN produccion

on:
  push:
    branches:
      - validation/visura-shipstatic-20261028

permissions:
  contents: read

jobs:
  external-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      STAGING_URL: https://keen-mote-b5w3hwc.shipstatic.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar paquete ZIP verificado sin datos personales
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib
          files=["index.html","VISURA_ORDENES.html","visura-recovery.js","visura-recovery.css",
                 "chatgpt-import.js","manifest.webmanifest",
                 "assets/icons/VISURA_CENTRO_DE_MANDO_ICONO_ORIGINAL.png",
                 "assets/icons/apple-touch-icon.png","assets/icons/favicon-32x32.png",
                 "assets/icons/icon-192.png","assets/icons/icon-512.png",
                 "assets/icons/visura-centro-mando-logo-64.png",
                 "assets/logo-visura-centro-mando.svg","assets/streaming-aviso-original.webp"]
          with zipfile.ZipFile("VISURA_PR82_PAQUETE_SAFARI.zip","w",zipfile.ZIP_DEFLATED) as z:
            manifest=[]
            for name in files:
              source=Path("docs")/name
              content=source.read_bytes()
              z.writestr("VISURA_PR82/"+name,content)
              manifest.append(hashlib.sha256(content).hexdigest()+"  "+name)
            instructions=("VISURA PR82 — paquete de prueba. Base: f09ea5602a6c7e7b767735d7da575ccedea5ea3a.\\n"
              "No contiene datos personales. Importacion de chats privados BLOQUEADA en dominios publicos.\\n"
              "Estructura identica a codigo origen. Para prueba web, servir carpeta via HTTP local en un equipo propio;\\n"
              "abrir el HTML con vista previa de Archivos en iPhone NO garantiza ejecutar JavaScript ni icono PWA.\\n"
              "Prueba de iPhone recomendada: usar una URL HTTPS verificada y solo datos ficticios.\\n")
            z.writestr("VISURA_PR82/LEEME_PRUEBAS.txt",instructions)
            z.writestr("VISURA_PR82/SHA256.txt","\\n".join(manifest)+"\\n")
          assert zipfile.ZipFile("VISURA_PR82_PAQUETE_SAFARI.zip").testzip() is None
          print("Paquete ZIP sin secretos, 14 recursos originales, checksums SHA256.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: VISURA-PR82-Safari-paquete-estatico
          path: VISURA_PR82_PAQUETE_SAFARI.zip
          retention-days: 7
      - name: Validar integridad en origen HTTPS y normalizar SOLO el cache buster de ShipStatic
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, urllib.request, json, hashlib, difflib
          from urllib.parse import urlparse
          host=os.environ["STAGING_URL"]
          assert urlparse(host).hostname.endswith(".shipstatic.com") and host.startswith("https://")
          for name in ["index.html","VISURA_ORDENES.html","manifest.webmanifest",
                       "visura-recovery.js","chatgpt-import.js","visura-recovery.css",
                       "assets/icons/apple-touch-icon.png","assets/icons/icon-192.png","assets/icons/icon-512.png"]:
              req=urllib.request.Request(host+"/"+name,headers={"User-Agent":"VISURA-staging-integrity-check/1.0"})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  assert resp.status==200, (name,resp.status)
                  actual=resp.read()
                  content_type=resp.headers.get("Content-Type","")
              if name.endswith(".html"):
                  expected=pathlib.Path("docs",name).read_text().replace(
                      "<head>",'<head>\n<meta name="robots" content="noindex,nofollow,noarchive">',1).encode()
              else:
                  expected=pathlib.Path("docs",name).read_bytes()
              canon=re.sub(rb"\?_ship=[A-Za-z0-9_-]+",b"",actual)
              if name.endswith(".webmanifest") and canon!=expected:
                  # El proveedor solo añade cache busters a URLs del manifest y puede variar
                  # su salto final de linea. Todas sus propiedades deben seguir siendo identicas.
                  if json.loads(canon)==json.loads(expected):
                      print("MANIFEST_SEMANTICAMENTE_IDENTICO",name)
                      canon=expected
              if canon!=expected:
                  print("DIFF",name,"actual_sha",hashlib.sha256(actual).hexdigest(),
                        "normalized_sha",hashlib.sha256(canon).hexdigest(),
                        "expected_sha",hashlib.sha256(expected).hexdigest())
                  if name.endswith(".webmanifest"):
                      print("MANIFEST_ORIGINAL",expected.decode("utf-8")[:850])
                      print("MANIFEST_HOST",actual.decode("utf-8")[:850])
                  raise AssertionError("El proveedor altero contenido mas alla del parametro conocido de cache")
              if name.endswith(".png"): assert "image/png" in content_type
              if name.endswith(".js"): assert "javascript" in content_type
              if name.endswith(".webmanifest"): assert json.loads(canon)["short_name"]=="VISURA MANDO"
              if name.endswith(".html"):
                  assert b"noindex" in actual and actual.count(b"<script")==3
              print("INTACTO_TRAS_CACHE_BUSTER",name)
          PY
      - name: Instalar Chromium en runner efimero (sin credenciales)
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: E2E real HTTPS - 11 funciones, copia, diagnóstico, privacidad y responsive
        run: python docs/test-visura-shipstatic-live.py
