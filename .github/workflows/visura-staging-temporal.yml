name: VISURA Centro - staging anonimo PR82 (expira automaticamente)

on:
  push:
    branches:
      - staging/visura-centro-pr82-anon-20261028

permissions:
  contents: read

jobs:
  deploy-one-hour-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NETLIFY_CLI_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar SOLO recursos estaticos aprobados (sin datos ni tests)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/assets/icons
          for file in index.html VISURA_ORDENES.html visura-recovery.js visura-recovery.css chatgpt-import.js manifest.webmanifest; do
            cp "docs/$file" "staging/$file"
          done
          for file in apple-touch-icon.png favicon-32x32.png icon-192.png icon-512.png visura-centro-mando-logo-64.png; do
            cp "docs/assets/icons/$file" "staging/assets/icons/$file"
          done
          cp docs/assets/logo-visura-centro-mando.svg staging/assets/logo-visura-centro-mando.svg
          cp docs/assets/streaming-aviso-original.webp staging/assets/streaming-aviso-original.webp
          cat > staging/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
            X-Content-Type-Options: nosniff
            Referrer-Policy: no-referrer
            Permissions-Policy: geolocation=(), camera=(), microphone=()
            Cache-Control: no-store
            Content-Security-Policy: default-src 'self'; connect-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'
          EOF
          test "$(find staging -type f | wc -l)" -eq 14
          grep -q 'canUseImportAtLocation' staging/chatgpt-import.js
          grep -q 'Importación privada desactivada' staging/chatgpt-import.js
          cmp -s staging/index.html staging/VISURA_ORDENES.html
          test ! -e staging/conversations.json
          test ! -e staging/.env
          echo "Paquete de ensayo: 14 ficheros estaticos sin JSON de conversaciones"
          find staging -type f | LC_ALL=C sort
      - name: Despliegue ANONIMO y gratuito (caduca ~1 hora; sin cuenta, sin token)
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=netlify-cli@latest -- netlify deploy --dir=staging --no-build --allow-anonymous --json > "$RUNNER_TEMP/netlify-staging.json"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "netlify-staging.json"
          result = json.loads(p.read_text())
          url = result.get("deploy_url") or result.get("url")
          if not isinstance(url, str) or not url.startswith("https://") or not url.split("/")[2].endswith(".netlify.app"):
              raise SystemExit("Respuesta de Netlify sin URL segura de staging")
          print("STAGING_URL="+url)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write("url="+url+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## VISURA PR82 — STAGING TEMPORAL Y PUBLICO\n\n")
              f.write("**URL de ensayo:** "+url+"\n\n")
              f.write("Duracion: ~1 hora sin reclamar, despues Netlify lo retira. Solo datos ficticios. **NO enviar exportaciones reales**.\n\n")
              f.write("Version base PR82: f09ea5602a6c7e7b767735d7da575ccedea5ea3a.\n")
          PY
      - name: Comprobar HTTP y archivos EXACTOS en el host temporal
        shell: bash
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for file in index.html VISURA_ORDENES.html visura-recovery.js visura-recovery.css chatgpt-import.js manifest.webmanifest assets/icons/apple-touch-icon.png assets/icons/favicon-32x32.png assets/icons/icon-192.png assets/icons/icon-512.png assets/streaming-aviso-original.webp; do
            curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "$STAGING_URL/$file" -o "$RUNNER_TEMP/download-check"
            cmp "staging/$file" "$RUNNER_TEMP/download-check"
            echo "OK 200 mismo contenido: $file"
          done
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSI "$STAGING_URL/assets/icons/apple-touch-icon.png" | grep -iq '^content-type: image/png'
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSI "$STAGING_URL/index.html" | grep -iq '^x-robots-tag: noindex'
          echo "Staging: recursos publicos exactos, icono PNG y noindex comprobados"
