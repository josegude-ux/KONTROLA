name: VISURA PREPARA 15 · Paridad Control de Cargas v0.5.6 (LAB)
on:
  push:
    branches:
      - lab/visura15-paridad-control-cargas-v056-20261109
  pull_request:
    branches:
      - integration/visura-prepara-b01-cierre-compatibilidad-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validacion-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias sin scripts de terceros
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sintaxis del cambio
        run: |
          node --check src/batch-selection-v056.mjs
          node --check src/admin-print-batch.mjs
          node --check tests/batch-selection-v056.test.mjs
      - name: Regresion seleccion v0.5.6 y lote administrativo
        run: node --test tests/batch-selection-v056.test.mjs tests/admin-print-batch.test.mjs
      - name: Regresion existente completa (sin servidor)
        run: npm test
